[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "floppy-tracker"
version = "0.1.3"
description = "A hardware-agnostic python library to monitor the computational cost of Machine and Deep Learning algorithms."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
authors = [
  { name="Francesco Scala", email="francesco.scala@icar.cnr.it" },
  { name="Francesco Mandarino", email="mndfnc04a15d005y@studenti.unical.it" },
  { name="Liliana Martirano", email="liliana.martirano@icar.cnr.it" },
  { name="Luigi Pontieri", email="luigi.pontieri@icar.cnr.it" },
]
keywords = ["Green AI", "Benchmarking", "Hardware-agnostic", "Machine Learning", "Deep learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "psutil>=5.9.0",
    "wandb>=0.15.0",
]

[project.urls]
Homepage = "https://floppy.icar.cnr.it/"
"Bug Tracker" = "https://github.com/Franco7Scala/FLOPpy/issues"
Documentation = "https://floppy.readthedocs.io/en/latest/"

[tool.setuptools.packages.find]
where = ["src"]
